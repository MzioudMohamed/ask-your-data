version: 2

models:
  - name: stg_orders
    description: "One row per order, with dates typed as timestamps."
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [not_null]

  - name: stg_customers
    description: "One row per order-customer link. A person is identified by customer_unique_id, because customer_id changes with every order."
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        data_tests: [not_null]

  - name: stg_order_items
    description: "One row per item of an order."
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: product_id
        data_tests: [not_null]
      - name: seller_id
        data_tests: [not_null]

  - name: stg_order_payments
    description: "One row per payment of an order. An order can have several payments."
    columns:
      - name: order_id
        data_tests: [not_null]

  - name: stg_order_reviews
    description: "One row per review. An order can have several reviews."
    columns:
      - name: review_id
        data_tests: [not_null]
      - name: order_id
        data_tests: [not_null]

  - name: stg_products
    description: "One row per product. The misspelled source columns (lenght) are renamed to length."
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: stg_sellers
    description: "One row per seller."
    columns:
      - name: seller_id
        data_tests: [unique, not_null]

  - name: stg_geolocation
    description: "Coordinates per zip code prefix. Not deduplicated here: several rows per prefix are possible and will be handled in the marts."

  - name: stg_product_category_translation
    description: "Portuguese to English product category names."
    columns:
      - name: product_category_name
        data_tests: [not_null]